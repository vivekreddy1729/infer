# Fly.io deployment.
#
# Chosen over Render/Railway for three reasons that matter to this workload:
#   - Dockerfile deploys with no buildpack guessing, so the pinned Playwright
#     base image is used verbatim.
#   - Persistent volumes on the cheapest tier, which the warm path needs.
#   - Machines can be pinned to a region, so the browser's timezone/locale and
#     the residential proxy's exit geography can be kept consistent. A US
#     residential IP driving a browser that reports a Frankfurt timezone is a
#     contradiction worth avoiding.
#
# Deploy:
#   fly launch --no-deploy --copy-config
#   fly volumes create session_data --size 1 --region ewr
#   fly secrets set SESSION_ENCRYPTION_KEY=$(openssl rand -hex 32)
#   fly secrets set RESIDENTIAL_PROXY_URL='http://user:pass@gate.provider.com:7000'
#   fly secrets set PROXY_USERNAME_TEMPLATE='user-session-{session}-sessionduration-10'
#   fly secrets set DIAGNOSTICS_TOKEN=$(openssl rand -hex 24)
#   fly deploy --remote-only
#
# `--remote-only` builds on Fly's builders, avoiding the need for local Docker
# disk to hold a ~2GB Playwright base image.
#
# Afterwards logs can be retrieved without shell access, which is the whole point
# of writing them to the volume:
#   curl -H "Authorization: Bearer $DIAGNOSTICS_TOKEN" \
#        'https://<app>.fly.dev/api/diagnostics/logs.txt?limit=5000' -o app.log

app = 'carrier-policy-puller'
primary_region = 'ewr'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  HOST = '0.0.0.0'
  DATA_DIR = '/data'
  LOG_LEVEL = 'info'
  NO_PRETTY = '1'

  # Logs must live on the mounted volume, not in the container filesystem.
  # Fly replaces the container on every deploy and on most restarts, so a default
  # of ./logs would silently discard exactly the history this is for — and you
  # would only discover that when you went looking for a failure that had already
  # been thrown away.
  LOG_DIR = '/data/logs'
  LOG_TO_FILE = 'true'
  LOG_REQUESTS = 'true'
  LOG_FAILURE_BUNDLES = 'true'
  BLOCK_RESOURCES = 'true'
  BROWSER_DRIVER = 'patchright'
  # Headed under Xvfb. Costs memory, buys a browser that looks windowed.
  HEADLESS = 'false'
  ENABLE_MOCK_CARRIER = 'true'

[[mounts]]
  source = 'session_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true

  # Critical for this app: a session sits blocked on human MFA input, and the
  # browser context lives in the machine's memory. Suspending the machine
  # mid-flow would destroy it, so autostop is disabled and one machine is always
  # running. This is a real cost decision, not an oversight.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    # Each in-flight pull holds a browser context. Admitting more than the RAM
    # supports gets the machine OOM-killed, which is a far worse failure than
    # a queued request.
    soft_limit = 8
    hard_limit = 12

[checks]
  [checks.health]
    type = 'http'
    port = 3000
    method = 'GET'
    path = '/api/health'
    interval = '30s'
    timeout = '10s'
    # Chrome needs time to come up before the first probe.
    grace_period = '45s'

[[vm]]
  # 1GB is not enough. Chrome plus Xvfb plus Node sits around 700-900MB with one
  # active context, and the OOM killer takes the whole machine, not just the tab.
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
