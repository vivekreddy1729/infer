# Local container run. Mirrors the deployed topology closely enough that a bug
# reproducing here is a bug in production too.

services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOST: 0.0.0.0
      DATA_DIR: /app/data

      # Required for GEICO, and set here rather than left to .env so a developer's
      # local file cannot silently disable a carrier in a container.
      #
      # GEICO's POST /ws/login/authenticate returns 302 headless and 200 headed; the
      # SPA cannot follow the redirect, so login stalls with no error (F-40). The
      # entrypoint runs the app under Xvfb when this is false, so it is a full real
      # Chrome on a virtual display — no window, no X server on the host needed.
      #
      # Costs ~80-150MB more RSS than headless. Budget for it before raising
      # BROWSER_POOL_SIZE.
      HEADLESS: 'false'
      # Logs go on the volume, not the container filesystem, so they outlive the
      # container. Losing the logs for the run that failed is the specific
      # scenario this guards against.
      LOG_DIR: /app/data/logs
      LOG_TO_FILE: 'true'
      LOG_REQUESTS: 'true'
      # Pretty-printing is a dev affordance; containers emit structured JSON so
      # the platform's log aggregator can parse it.
      NO_PRETTY: '1'
    volumes:
      # Encrypted storageState, Chrome profiles, metrics and logs all survive
      # container restarts. Without this, every deploy forces every user back onto
      # the cold path and discards the log history.
      - session-data:/app/data

    # Chrome will crash on content-heavy pages with Docker's default 64MB
    # /dev/shm. Raising it is cheaper and safer than --disable-dev-shm-usage
    # alone, so we do both.
    shm_size: '1gb'

    # A browser rendering untrusted remote pages. Keep the blast radius small.
    security_opt:
      - no-new-privileges:true

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(h=>process.exit(h.browser&&h.browser.ready?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

volumes:
  session-data:
